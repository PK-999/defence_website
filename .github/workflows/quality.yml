name: SENTINEL quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./.test-data/ci.db
      SITE_URL: http://127.0.0.1:3100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run lint -- --quiet
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:components
      - run: npm run test:integration
      - run: npm run validate:content
      - run: npm run validate:assets
      - run: mkdir -p .test-data && npx prisma migrate deploy
      - run: npm run validate:database
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    needs: javascript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          SITE_URL: http://127.0.0.1:3100

  factory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.17"
      - run: uv sync --directory factory --locked --dev
      - run: uv run --directory factory pytest tests/test_extraction.py
